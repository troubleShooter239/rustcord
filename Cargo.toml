[package]
name = "rustcord"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
license = "GPL-3.0-or-later"
description = "Discord desktop client with Vencord and system webviews"

[[bin]]
name = "rustcord"
path = "src/native/main.rs"

[build-dependencies]
tauri-build = "2.6.3"

[features]
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
open = "5"
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "~2.12.5", default-features = false, features = [
    "wry", "tray-icon", "compression", "common-controls-v6", "x11", "dbus",
] }
tempfile = "3"
tokio = { version = "1", features = ["fs", "io-util", "rt-multi-thread", "net", "time"] }
uuid = { version = "1", features = ["v4"] }

[target.'cfg(windows)'.dependencies]
webview2-com = "0.39.1"
windows = { version = "0.62", features = ["Win32_Graphics_Dwm", "Win32_UI_Controls"] }
windows-core = "0.62"

[target.'cfg(target_os = "macos")'.dependencies]
sha2 = "0.10"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
