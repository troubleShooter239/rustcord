name: test
on:
    push:
        branches:
            - main
    pull_request:
        branches:
            - main
jobs:
    rustcord:
        strategy:
            fail-fast: false
            matrix:
                os: [windows-latest, ubuntu-24.04, macos-latest]
        runs-on: ${{ matrix.os }}

        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: 24

            - name: Install Linux desktop dependencies
              if: runner.os == 'Linux'
              run: |
                  sudo apt-get update
                  sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libdbus-1-dev libssl-dev

            - name: Prepare the pinned Vencord bundle
              run: node scripts/prepare-vencord.mjs

            - name: Check JavaScript syntax
              run: |
                  node --check scripts/prepare-vencord.mjs
                  node --check src/native/vencord.js
                  node --check src/native/ui/editor.js

            - name: Check Rustcord
              run: |
                  cargo fmt --check
                  cargo clippy --locked --all-targets --all-features -- -D warnings
                  cargo test --locked
